plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'dev.xdpxi'
version = '1.0.0-beta.9'

ext.lwjglVersion = "3.3.6"

repositories {
    mavenCentral()
    maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
}

def lwjglNativesList = [
    "natives-windows",
    "natives-windows-x86",
    "natives-windows-arm64",
    "natives-linux",
    "natives-linux-arm32",
    "natives-linux-arm64",
    "natives-macos",
    "natives-macos-arm64"
]

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation "com.formdev:flatlaf:3.7"

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-assimp"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"

    lwjglNativesList.each { n ->
        runtimeOnly "org.lwjgl:lwjgl::$n"
        runtimeOnly "org.lwjgl:lwjgl-assimp::$n"
        runtimeOnly "org.lwjgl:lwjgl-glfw::$n"
        runtimeOnly "org.lwjgl:lwjgl-openal::$n"
        runtimeOnly "org.lwjgl:lwjgl-opengl::$n"
        runtimeOnly "org.lwjgl:lwjgl-stb::$n"
    }
}

application {
    mainClass = 'dev.xdpxi.pixelleap.Main'
    applicationDefaultJvmArgs = ["-XstartOnFirstThread"]
}

shadowJar {
    archiveClassifier.set("")
    configurations = [project.configurations.runtimeClasspath]

    manifest {
        attributes(
                'Main-Class': 'dev.xdpxi.pixelleap.Main'
        )
    }
}

jar {
    enabled = false
}

// Make distribution tasks depend on shadowJar
distZip.dependsOn shadowJar
distTar.dependsOn shadowJar
startScripts.dependsOn shadowJar

test {
    useJUnitPlatform()
}
